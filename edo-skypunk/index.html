const NRM=[[1,0],[-1,0],[0,1],[0,-1]];const _jc=new THREE.Color();

const _m4=new THREE.Matrix4(),_o3=new V3(),_t3=new V3();

// curved Japanese roof: top rectangle (w0,d0) at y+h sweeping down to eave rectangle (w1,d1) at y.
// The eave runs level along most of each side and sweeps up smoothly only near the corners (noki-zori).

const plasterTex=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#fff';g.fillRect(0,0,w,h);

for(const d of SET){if(!d.k)continue;const inp=$('si_'+d.k);showS(d);
  inp.addEventListener('input',()=>{const v=+inp.value;if(d.k==='time')dayT=v;else{ST[d.k]=v;applyS(d.k);saveS()}$('sv_'+d.k).textContent=fmtv(d,v)});
  inp.addEventListener('keydown',e=>{if(e.code!=='Tab')e.stopPropagation()})}   // arrow keys move the slider, not the broom
$('setReset').onclick=()=>{for(const d of SET)if(d.def!=null)setS(d.k,d.def)};
$('setClose').onclick=()=>togglePanel(false);
// photo mode: only the scenery is left (H again to come back)
let photo=false,photoFov=null,hintT=0;
function setPhoto(on){photo=on;photoFov=null;document.body.classList.toggle('photo',on);player.visible=!on;if(on)togglePanel(false);
  const h=$('photoHint');h.style.opacity=on?1:0;clearTimeout(hintT);if(on)hintT=setTimeout(()=>h.style.opacity=0,3500)}
$('setPhoto').onclick=()=>setPhoto(true);
function togglePanel(open){open=open??!setPanel.classList.contains('open');setPanel.classList.toggle('open',open);if(open&&document.pointerLockElement)document.exitPointerLock()}
$('menuBtn').onclick=()=>togglePanel();
setTimeout(()=>{for(const k in ST)applyS(k)},0);   // after the whole script has run (some targets are declared further down)
$('go').textContent='起飛';$('go').disabled=false;
$('go').addEventListener('click',()=>{
  $('start').style.display='none';$('hud').style.display='block';started=true;initAudio();lock();
  newJob();showStats();toast('歡迎來到天街。\n先去金色光柱那裡取貨吧。',5);
});

/* ---------- time of day ---------- */
const KF=[
 {t:0,  top:'#3f84d0',hor:'#cfe2f2',sun:'#fff3dc',si:1.15,amb:.9,n:0},
 {t:.42,top:'#3f80c8',hor:'#e3e4dc',sun:'#ffeccc',si:1.1,amb:.9,n:0},
 {t:.55,top:'#5b6fb0',hor:'#ffbd90',sun:'#ff9d62',si:.9,amb:.62,n:.4},
 {t:.63,top:'#18204e',hor:'#5a3f72',sun:'#9aa4e0',si:.34,amb:.42,n:1},
 {t:.88,top:'#0f1640',hor:'#3d3266',sun:'#9aa4e0',si:.34,amb:.4,n:1},
 {t:.95,top:'#6a7fc4',hor:'#ffcbb0',sun:'#ffb48a',si:.7,amb:.62,n:.35},
 {t:1,  top:'#3f84d0',hor:'#cfe2f2',sun:'#fff3dc',si:1.15,amb:.9,n:0}].map(k=>({...k,top:C(k.top),hor:C(k.hor),sun:C(k.sun)}));
let night=0,quality=2;const sdir=new V3();
const winDay=C('#f2efe6'),winNight=new THREE.Color(1.25,.92,.5),glowDay=C('#ece4d8'),glowNight=new THREE.Color(1.3,1.15,.9),cloudE=C('#8fa3bd');
const smoothstep01=x=>{x=clamp(x,0,1);return x*x*(3-2*x)};
function applyTime(){
  let i=0;while(i<KF.length-2&&dayT>=KF[i+1].t)i++;
  const a=KF[i],b=KF[i+1],f=(dayT-a.t)/(b.t-a.t);
  skyU.top.value.lerpColors(a.top,b.top,f);skyU.hor.value.lerpColors(a.hor,b.hor,f);scene.fog.color.copy(skyU.hor.value);
  // warm key light, cool sky fill, warm bounce from the wooden city below: shadows read blue, sunlit wood reads honey
  sun.color.lerpColors(a.sun,b.sun,f);sun.intensity=lerp(a.si,b.si,f)*2.6;hemi.intensity=lerp(a.amb,b.amb,f)*1.75;
  hemi.color.copy(skyU.top.value).lerp(WHITE,.32);hemi.groundColor.copy(skyU.hor.value).lerp(BOUNCE,.65);
  night=lerp(a.n,b.n,f);
  const ang=dayT*6.283;sdir.set(Math.cos(ang)*.55+.25,.75+.2*Math.sin(ang),Math.sin(ang)*.55+.3).normalize();
  // the sun by day, the moon by night: sky disc, key light, light shafts and the bright side of the fog all follow it
  skyU.sunDir.value.copy(sdir);skyU.sunCol.value.copy(sun.color);skyU.night.value=night;
  lightDir.copy(sdir).lerp(moonDir,smoothstep01(night)).normalize();sdir.copy(lightDir);
  postU.uSunDir.value.copy(lightDir);postU.uSunCol.value.copy(sun.color).lerp(C('#c9d0ff'),night);postU.uFogCol.value.copy(skyU.hor.value).lerp(C('#c4d8ec'),.45*(1-night));
  postU.uShaftCol.value.copy(sun.color).lerp(C('#aeb8ff'),night).multiplyScalar(lerp(.55,.4,night));
  postU.uFogA.value=lerp(.0015,.0026,night);
  washU.ref.value=Math.max(.05,(sun.intensity+hemi.intensity)/Math.PI*.85);   // the light level a fully lit surface gets right now
  moteU.uNight.value=lanternU.uNight.value=night;
  sun.target.position.set(Math.round(P.pos.x/8)*8,Math.round(P.pos.y/8)*8,Math.round(P.pos.z/8)*8);sun.position.copy(sun.target.position).addScaledVector(sdir,750);
  M.fac.emissiveIntensity=night*1.5;postU.night.value=night;
  spTint.value.copy(sun.color).multiplyScalar(.22).addScalar(.8).lerp(C('#59608a'),night*.85);
  M.win.color.lerpColors(winDay,winNight,night);M.glow.color.lerpColors(glowDay,glowNight,night);
  haloMat.opacity=night*.7;starMat.opacity=Math.max(0,night-.4)*1.6;
  // clouds: sunlit tops, sky-tinted undersides; at night dim blue tops and a warm glow from the lanterns below
  cloudU.uTint.value.copy(sun.color).lerp(WHITE,.35).lerp(C('#4a5288'),night*.8);
  cloudU.uShade.value.copy(skyU.hor.value).lerp(WHITE,.45*(1-night)).lerp(C('#a86a58'),night*.55);
  cloudU.uAmt.value=SV('clouds');
  postU.uFogA.value*=SV('fog');lanternU.uNight.value=night*SV('lanterns');moteU.uAmt.value=SV('motes');
}

/* ---------- main loop ---------- */
const camR=new V3(),named=towers.concat(mids,villages,trans);let detTick=0;
const fwd=new V3(),tmp=new V3(),look=new V3();let last=performance.now(),bumpCd=0,nearName='',toriiCd=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000);last=now;clock+=dt;
  if(started){
    dayT=(dayT+dt/420*ST.timeSpeed)%1;
    if(setPanel.classList.contains('open')&&(++detTick)%15===0)showS(SET[1]);
    // steering
    const sh=key.ShiftLeft||key.ShiftRight,yi=((key.ArrowLeft||(!sh&&key.KeyA))?1:0)-((key.ArrowRight||(!sh&&key.KeyD))?1:0),pi=(key.ArrowUp?1:0)-(key.ArrowDown?1:0);
    P.yawVel=damp(P.yawVel,yi*1.5,7,dt);P.pitchVel=damp(P.pitchVel,pi*1.1,7,dt);
    const dyaw=P.yawVel*dt-mdx*.0022*ST.mouse,dpitch=P.pitchVel*dt-mdy*.0022*ST.mouse*(ST.invertY?-1:1);mdx=mdy=0;
    P.yaw+=dyaw;P.pitch=clamp(P.pitch+dpitch,photo?-1.55:-1.3,photo?1.55:1.3);
    P.roll=damp(P.roll,clamp(-dyaw/dt*.45,-.9,.9),5,dt);
    // nothing pressed: hang in the air and look around. W flies forward, Space sprints, S backs off, Shift+A/D slides sideways without turning
    const boost=key.Space,go=key.KeyW||boost,tgt=(go?(boost?120:60)*ST.flySpeed:key.KeyS?-14:0)*(photo?.35:1);
    P.speed=damp(P.speed,tgt,go?1.2:key.KeyS?2.2:1.8,dt);
    P.side=damp(P.side||0,(sh?((key.KeyD?1:0)-(key.KeyA?1:0)):0)*28*ST.flySpeed*(photo?.35:1),3,dt);
    P.vy=damp(P.vy,((key.KeyE)?30:0)-((key.KeyQ||key.KeyC)?30:0),4,dt);
    fwd.set(Math.sin(P.yaw)*Math.cos(P.pitch),Math.sin(P.pitch),Math.cos(P.yaw)*Math.cos(P.pitch));
    P.pos.addScaledVector(fwd,P.speed*dt);P.pos.x-=Math.cos(P.yaw)*P.side*dt;P.pos.z+=Math.sin(P.yaw)*P.side*dt;P.pos.y+=P.vy*dt;
    if(P.pos.y<1.8){P.pos.y=1.8;if(P.pitch<0)P.pitch=damp(P.pitch,.02,5,dt)}
    if(P.pos.y>1500)P.pos.y=1500;
    const hr=Math.hypot(P.pos.x,P.pos.z);if(hr>4300){P.pos.x*=4300/hr;P.pos.z*=4300/hr}
    bumpCd-=dt;
    if(collide(P.pos,photo?2.6:1.7)){P.speed*=Math.pow(.02,dt);if(bumpCd<=0&&P.speed>25){bumpCd=.6;pluck(110,.12,'sine',.25)}}
    // job logic
    if(job){
      const tp=job.stage===0?job.from.pos:job.to.pos;
      if(P.pos.distanceTo(tp)<8.5){
        if(job.stage===0){job.stage=1;job.t0=clock;job.par=job.from.pos.distanceTo(job.to.pos)/38+14;parcel.visible=true;setTarget(job.to.pos,0xff7a9a);showJob();chime(true);toast(`取到『${job.item}』`,2)}
        else{const d=job.from.pos.distanceTo(job.to.pos),base=Math.round(d/8)+20,tip=Math.max(0,Math.round((job.par-(clock-job.t0))*2));
          save.coins+=base+tip;save.deliv++;persist();showStats();parcel.visible=false;chime(false);
          toast(`〈${job.to.T.name}〉的客人收下了『${job.item}』\n酬勞 ${base} 文${tip?`　＋小費 ${tip} 文`:''}`,4);newJob()}
      }else if(job.stage===1){const left=job.par-(clock-job.t0),e=$('tip');if(e)e.textContent=left>0?`準時小費還剩 ${Math.ceil(left)} 秒`:'慢慢飛也沒關係'}
    }
    for(let i=0;i<cats.length;i++){const c=cats[i];if(c.found)continue;const d2=c.pos.distanceToSquared(P.pos);
      c.sp.position.y=c.sy+Math.sin(clock*1.6+i)*.25;
      if(d2<900&&clock>c.heard){c.heard=clock+7+Math.random()*4;meow(.05+.06*(1-Math.sqrt(d2)/30))}   // a sleepy meow when you are close
      if(d2<64){c.found=true;c.sp.visible=false;save.cats.push(i);save.coins+=30;persist();showStats();meow();
      toast(`摸到了睡在〈${c.T.name}〉陽台上的${c.name}\n（${save.cats.length}/${cats.length}）${save.cats.length===cats.length?'\n全城的貓都認識你了！':''}`,4)}}
    toriiCd-=dt;
    if(toriiCd<=0&&P.pos.distanceToSquared(toriiPos)<900){toriiCd=60;if(!save.torii){save.torii=true;save.coins+=300;persist();showStats()}
      chime(false);toast('神木鳥居\n風停了一瞬。整座天街，都在你身後。',6)}
    // ambient
    if(AC){windGain.gain.value=clamp(P.speed/115,0,1)*.22+.02;windBp.frequency.value=300+P.speed*7;
      nextPluck-=dt;if(nextPluck<=0){nextPluck=R(1.4,4.5)*.0+1.2+Math.random()*3.5;pluck(SCALE[Math.floor(Math.random()*SCALE.length)]*(Math.random()<.3?.5:1),.045+night*.02)}}
    // HUD
    $('fly').textContent=`高度 ${Math.round(P.pos.y)} 尺　速度 ${Math.round(P.speed)}`;
    let nt='',bd=95*95;for(const T of named){const d=(T.x-P.pos.x)**2+(T.z-P.pos.z)**2;if(d<bd&&P.pos.y<T.top+40){bd=d;nt=T.name}}
    if(P.pos.distanceToSquared(TREE)<1100*1100*2&&Math.hypot(P.pos.x-TREE.x,P.pos.z-TREE.z)<900)nt='神木';
    if(nt!==nearName){nearName=nt;const e=$('near');if(nt){e.textContent=nt;e.style.opacity=1}else e.style.opacity=0}
    if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').style.opacity=0}
  }else{ // title: slow orbit
    P.yaw+=dt*.05;fwd.set(Math.sin(P.yaw),0,Math.cos(P.yaw));
  }
  // player visuals + camera
  player.position.copy(P.pos);player.position.y+=Math.sin(clock*2.1)*.12;
  player.rotation.set(-P.pitch,P.yaw,P.roll);
  {const acc=(P.speed-(P.ls??P.speed))/Math.max(dt,1e-3);P.ls=P.speed;P.acc=damp(P.acc||0,acc,3,dt);   // lean into acceleration, sit back when braking
   heroBody.rotation.x=damp(heroBody.rotation.x,clamp(P.acc*.007+P.speed*.0024,-.35,.55),4,dt);
   pMesh.rotation.x=damp(pMesh.rotation.x,clamp(P.acc*.0025,-.14,.16),3,dt);
   heroU.uPh.value=(heroU.uPh.value+dt*(3+10*heroU.uW.value))%6283.2;fallsTex.offset.y=(fallsTex.offset.y-dt*1.4)%1;
   for(const m of horMeshes)m.position.set(camera.position.x,camera.position.y+m.userData.dy,camera.position.z);heroU.uW.value=damp(heroU.uW.value,clamp(Math.abs(P.speed)/100,0,1),2.5,dt);heroU.uVy.value=damp(heroU.uVy.value,clamp((P.vy||0)/40,-.8,.8),4,dt);
   heroU.uSide.value=damp(heroU.uSide.value,clamp(P.roll*.5+(P.side||0)/60,-.6,.6),4,dt)}
  if(photo){   // photo mode: the camera is where the (hidden) rider is, so it can go right up to a railing and look straight down
    camera.position.lerp(P.pos,window.__camSnap?1:1-Math.exp(-10*dt));look.copy(camera.position).add(fwd);camera.lookAt(look);
  }else{
    tmp.copy(P.pos).addScaledVector(fwd,-(11.5+Math.max(0,P.speed)*.035)*ST.camDist);tmp.y+=5*ST.camDist;
    camera.position.lerp(tmp,window.__camSnap?1:1-Math.exp(-7*dt));
    look.copy(P.pos).addScaledVector(fwd,12);look.y+=1.4;camera.lookAt(look);
  }
  if(window.__orbit!=null){const a=P.yaw+window.__orbit,r=window.__orbitR||7;camera.position.set(P.pos.x+Math.sin(a)*r,P.pos.y+1.5,P.pos.z+Math.cos(a)*r);camera.lookAt(P.pos.x,P.pos.y+1.2,P.pos.z)}   // debug: look at the rider from any side
  updatePlayerCard();
  const fov=(photo&&photoFov?photoFov:ST.fov)+Math.max(0,P.speed)*.2;if(Math.abs(camera.fov-fov)>.05){camera.fov=damp(camera.fov,fov,3,dt);camera.updateProjectionMatrix()}
  // npcs
  windU.value=clock;
  camera.updateMatrixWorld();camR.setFromMatrixColumn(camera.matrixWorld,0);
  {const a=walkPos.array;
   for(let i=0;i<walkers.length;i++){const w=walkers[i];w.p+=w.v*dt;if(w.p>w.hi){w.p=w.hi;w.v=-w.v}else if(w.p<w.lo){w.p=w.lo;w.v=-w.v}
     a[i*3]=w.a?w.p:w.c;a[i*3+1]=Math.abs(Math.sin(clock*7+w.ph))*.13;a[i*3+2]=w.a?w.c:w.p}
   walkPos.needsUpdate=true}
  {const a=flyPos.array,fl=flyDat.array;
   for(let i=0;i<npcs.length;i++){const n=npcs[i];let x,y,z;
     if(n.r){ // commuter: fly door to door, pause, pick the next
       const A=nodes[n.from],Bn=nodes[n.to];
       if(n.wait>0){n.wait-=dt;x=A.x;y=A.y+Math.sin(clock*2+n.ph)*.25;z=A.z}
       else{n.t+=dt*n.sp/Math.max(1,A.distanceTo(Bn));
         if(n.t>=1){n.from=n.to;n.to=pick2(routes[n.from]);n.t=0;n.wait=2+Math.random()*6}
         const A2=nodes[n.from],B2=nodes[n.to],e=n.t*n.t*(3-2*n.t);x=lerp(A2.x,B2.x,e);y=lerp(A2.y,B2.y,e)+Math.sin(clock*2+n.ph)*.3;z=lerp(A2.z,B2.z,e)}}
     else{n.a+=n.sp*dt/((n.rx+n.rz)*.5);x=n.cx+Math.cos(n.a)*n.rx;z=n.cz+Math.sin(n.a)*n.rz;y=n.y+Math.sin(n.a*3)*n.bob}
     const dv=(x-n.lx)*camR.x+(z-n.lz)*camR.z;if(Math.abs(dv)>1e-3)n.f=dv>0?1:-1;n.lx=x;n.lz=z;   // face the way it is flying
     a[i*3]=x;a[i*3+1]=y+.6;a[i*3+2]=z;fl[i*4+3]=n.f}
   flyPos.needsUpdate=flyDat.needsUpdate=true}
  if((++detTick)%6===0){const cp=camera.position;for(const m of detailMeshes){const s=m.geometry.boundingSphere;m.visible=cp.distanceTo(s.center)-s.radius<DET_D}}
  // petals
  const cx=camera.position.x,cy=camera.position.y,cz=camera.position.z;
  for(let i=0;i<PET;i++){const k=i*3;
    petPos[k]+=(petVel[k]+Math.sin(clock+i)*1.5)*dt;petPos[k+1]+=petVel[k+1]*dt;petPos[k+2]+=(petVel[k+2]+Math.cos(clock*.7+i)*1.5)*dt;
    petPos[k]=((petPos[k]-cx+90)%180+180)%180-90+cx;petPos[k+1]=((petPos[k+1]-cy+90)%180+180)%180-90+cy;petPos[k+2]=((petPos[k+2]-cz+90)%180+180)%180-90+cz}
  petGeo.attributes.position.needsUpdate=true;
  // marker
  marker.visible=started&&!!job&&!photo;ring.rotation.y=clock*1.5;ring2.rotation.x=clock*2;ring2.rotation.y=clock;beamMat.opacity=.2+Math.sin(clock*3)*.06;
  sky.position.copy(camera.position);stars.position.copy(camera.position);cloudMesh.userData.sort(camera.position);
  applyTime();
  moteU.uTime.value=lanternU.uTime.value=clock;moteU.uCam.value.copy(camera.position);
  renderFrame(quality);
  // target arrow
  if(started&&job){
    const tp=job.stage===0?job.from.pos:job.to.pos,e=$('arrow');tmp.copy(tp).project(camera);
    camera.getWorldDirection(look);const behind=look.dot(_v.copy(tp).sub(camera.position))<0;
    let x=tmp.x,y=tmp.y,off=behind||Math.abs(x)>.92||Math.abs(y)>.86;
    if(behind){x=-x;y=-y}
    if(off){const s=Math.min(.92/Math.max(1e-4,Math.abs(x)),.86/Math.max(1e-4,Math.abs(y)));x*=s;y*=s}
    e.style.left=((x+1)/2*innerWidth)+'px';e.style.top=((1-y)/2*innerHeight)+'px';
    const ic=e.firstChild;ic.textContent=off?'▲':'◆';ic.style.transform=off?`rotate(${Math.atan2(x,y)}rad)`:'';
    e.lastChild.textContent=Math.round(P.pos.distanceTo(tp))+' 尺';e.style.display='block';
  }else $('arrow').style.display='none';
}
pMesh.castShadow=true;
loadAssets();
applyTime();requestAnimationFrame(frame);
function bench(q,n=6){const gl=renderer.getContext(),px=new Uint8Array(4),sh=sun.castShadow;sun.castShadow=q===2;let best=1e9;
  for(let i=0;i<n;i++){const t0=performance.now();
    renderFrame(q);
    gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);if(i>1)best=Math.min(best,performance.now()-t0)}
  sun.castShadow=sh;return +best.toFixed(1)}
window.__dbg={bench,P,towers,links,mids,villages,trans,terraces,allDoors,cats,renderer,detailMeshes,flyMesh,cloudMesh,applyTime,get job(){return job},set dayT(v){dayT=v}};
